
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recomandările tale | Libria</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f7f3fc;
            color: #30253c;
        }

        .navbar {
            background: #69439b;
        }

        .navbar-brand {
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
        }

            .navbar-brand:hover {
                color: white;
            }

        .hero {
            background: linear-gradient(120deg, #4d356c, #806495);
            color: white;
            border-radius: 20px;
            padding: 35px;
        }

        .carte-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(60, 30, 90, 0.08);
            height: 100%;
        }

        .coperta {
            width: 100%;
            height: 260px;
            object-fit: contain;
            background: #eee7f5;
            padding: 15px;
        }

        .scor {
            background: #eee5f8;
            color: #4d2d78;
            border-radius: 10px;
            padding: 8px 12px;
            font-weight: bold;
            display: inline-block;
        }

        .btn-libria {
            background: #69439b;
            color: white;
        }

            .btn-libria:hover {
                background: #4d2d78;
                color: white;
            }

        .btn-outline-libria {
            border: 1px solid #69439b;
            color: #69439b;
        }

            .btn-outline-libria:hover {
                background: #eee5f8;
                color: #4d2d78;
            }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark py-3">
        <div class="container">
            <a class="navbar-brand" href="/">Libria</a>

            <a class="btn btn-outline-light"
               href="/index.html">
                Înapoi la catalog
            </a>
        </div>
    </nav>

    <main class="container py-5">

        <section class="hero mb-4">
            <h1 class="fw-bold">
                Cărți recomandate pentru tine
            </h1>

            <p class="mb-3">
                Am analizat preferințele tale de lectură și
                am calculat compatibilitatea cu titlurile din Libria.
            </p>

            <a href="/preferinte.html"
               class="btn btn-light">
                Modifică preferințele
            </a>
        </section>

        <div id="mesaj-incarcare"
             class="alert alert-info">
            Se generează recomandările...
        </div>

        <div id="mesaj-eroare"
             class="alert alert-danger d-none"
             role="alert">
        </div>

        <div id="informatii-rezultate"
             class="mb-4 d-none">
            <h2 class="h4 fw-bold">
                Rezultatele tale
            </h2>
            <p id="numar-rezultate"
               class="text-muted">
            </p>
        </div>

        <div id="lista-recomandari"
             class="row g-4">
        </div>

    </main>

    <script src="/js/recommendationExplanations.js"></script>

    <script>
    'use strict';

        const listaRecomandari =
            document.getElementById('lista-recomandari');

        const mesajIncarcare =
            document.getElementById('mesaj-incarcare');

        const mesajEroare =
            document.getElementById('mesaj-eroare');

        const informatiiRezultate =
            document.getElementById('informatii-rezultate');

        const numarRezultate =
            document.getElementById('numar-rezultate');

        let preferinteCurente = null;
        let genuriDisponibile = [];
        let temeDisponibile = [];

        function afiseazaEroare(text) {
            mesajIncarcare.classList.add('d-none');
            mesajEroare.textContent = text;
            mesajEroare.classList.remove('d-none');
        }

        function creeazaElement(tag, clasa, text) {
            const element = document.createElement(tag);

            if (clasa) {
                element.className = clasa;
            }

            if (text !== undefined) {
                element.textContent = text;
            }

            return element;
        }

        function afiseazaCarte(carte) {
            const coloana = creeazaElement(
                'div',
                'col-12 col-md-6 col-lg-4'
            );

            const card = creeazaElement(
                'article',
                'carte-card'
            );

            // Coperta, daca exista in datele cartii
            if (carte.cover_url) {
                const imagine = creeazaElement(
                    'img',
                    'coperta'
                );

                imagine.src = carte.cover_url;
                imagine.alt = `Coperta cartii ${carte.title}`;
                imagine.loading = 'lazy';

                card.appendChild(imagine);
            }

            const continut = creeazaElement(
                'div',
                'p-4'
            );

            const scor = creeazaElement(
                'div',
                'scor mb-3',
                `Compatibilitate: ${carte.score}/100`
            );

            const titlu = creeazaElement(
                'h3',
                'h5 fw-bold',
                carte.title
            );

            const autor = creeazaElement(
                'p',
                'text-muted mb-2',
                `Autor: ${carte.author}`
            );

            const pagini = creeazaElement(
                'p',
                'mb-3',
                `Număr de pagini: ${carte.pages ?? 'Necunoscut'}`
            );

            const detalii = creeazaElement(
                'a',
                'btn btn-outline-libria',
                'Vezi detalii'
            );

            const explicatie = explicaRecomandare(
                carte,
                preferinteCurente,
                genuriDisponibile,
                temeDisponibile
            );

            const sectiune = creeazaElement(
                'details',
                'mt-3 border rounded p-3'
            );

            const sumar = creeazaElement(
                'summary',
                'fw-bold',
                'De ce mi-ai recomandat această carte?'
            );

            sectiune.appendChild(sumar);

            const nivel = creeazaElement(
                'p',
                'mt-3 fw-semibold',
                `Nivel de compatibilitate: ${explicatie.nivel}`
            );

            sectiune.appendChild(nivel);

            const criterii = [
                {
                    titlu: 'Genuri literare',
                    scor: explicatie.punctaje.genres,
                    maxim: 50,
                    descriere: explicatie.explicatieGenuri
                },
                {
                    titlu: 'Teme abordate',
                    scor: explicatie.punctaje.themes,
                    maxim: 30,
                    descriere: explicatie.explicatieTeme
                },
                {
                    titlu: 'Lungimea cărții',
                    scor: explicatie.punctaje.bookLength,
                    maxim: 20,
                    descriere: explicatie.explicatieLungime
                }
            ];

            criterii.forEach(criteriu => {
                const bloc = creeazaElement('div', 'mb-3');

                bloc.appendChild(
                    creeazaElement(
                        'div',
                        'small fw-bold mb-1',
                        `${criteriu.titlu}: ${criteriu.scor}/${criteriu.maxim} puncte`
                    )
                );

                const progres = creeazaElement(
                    'div',
                    'progress mb-2'
                );

                const bara = creeazaElement(
                    'div',
                    'progress-bar'
                );

                bara.setAttribute('role', 'progressbar');

                bara.style.width =
                    `${(criteriu.scor / criteriu.maxim) * 100}%`;

                bara.style.backgroundColor = '#69439b';

                bara.setAttribute(
                    'aria-label',
                    `Punctaj ${criteriu.titlu}`
                );

                bara.setAttribute(
                    'aria-valuenow',
                    String(criteriu.scor)
                );

                bara.setAttribute('aria-valuemin', '0');
                bara.setAttribute(
                    'aria-valuemax',
                    String(criteriu.maxim)
                );

                progres.appendChild(bara);
                bloc.appendChild(progres);

                bloc.appendChild(
                    creeazaElement(
                        'p',
                        'small text-muted',
                        criteriu.descriere
                    )
                );

                sectiune.appendChild(bloc);
            });

            if (explicatie.lipsaGenuri.length) {
                sectiune.appendChild(
                    creeazaElement(
                        'p',
                        'small',
                        'Genuri fără potrivire: ' +
                        explicatie.lipsaGenuri.join(', ')
                    )
                );
            }

            if (explicatie.lipsaTeme.length) {
                sectiune.appendChild(
                    creeazaElement(
                        'p',
                        'small',
                        'Teme fără potrivire: ' +
                        explicatie.lipsaTeme.join(', ')
                    )
                );
            }

            detalii.href =
                `/book.html?id=${encodeURIComponent(carte.id)}`;

            continut.appendChild(scor);
            continut.appendChild(titlu);
            continut.appendChild(autor);
            continut.appendChild(pagini);
            continut.appendChild(detalii);
            continut.appendChild(sectiune);

            card.appendChild(continut);
            coloana.appendChild(card);

            return coloana;
        }

        async function incarcaRecomandari() {
            let preferinte;

            try {
                const salvate =
                    sessionStorage.getItem('libriaPreferinte');

                preferinte = salvate
                    ? JSON.parse(salvate)
                    : null;

            } catch (eroare) {
                afiseazaEroare(
                    'Preferințele nu au putut fi citite. ' +
                    'Completează din nou chestionarul.'
                );
                return;
            }

            if (!preferinte) {
                afiseazaEroare(
                    'Nu ai completat încă chestionarul. ' +
                    'Accesează pagina de preferințe.'
                );
                return;
            }

            preferinteCurente = preferinte;

            try {
                const [raspunsGenuri, raspunsTeme] = await Promise.all([
                    fetch('/api/genres'),
                    fetch('/api/themes')
                ]);

                if (!raspunsGenuri.ok || !raspunsTeme.ok) {
                    throw new Error('Nu s-au putut încărca denumirile criteriilor.');
                }

                genuriDisponibile = await raspunsGenuri.json();
                temeDisponibile = await raspunsTeme.json();
            } catch (eroare) {
                console.warn(eroare.message);
                const avertizare = creeazaElement(
                    'div',
                    'alert alert-warning mb-4',
                    'Recomandările au fost calculate, dar unele denumiri ' +
                    'ale genurilor și temelor nu au putut fi încărcate. ' +
                    'Explicațiile pot fi incomplete.'
                );

                listaRecomandari.before(avertizare);
            }

            try {
                const raspuns = await fetch(
                    '/api/recommendations',
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(preferinte)
                    }
                );

                const date = await raspuns.json();

                if (!raspuns.ok) {
                    throw new Error(
                        date.error ||
                        'Nu s-au putut genera recomandările.'
                    );
                }

                if (!Array.isArray(date)) {
                    throw new Error(
                        'Serverul a returnat un răspuns invalid.'
                    );
                }

                mesajIncarcare.classList.add('d-none');

                informatiiRezultate.classList.remove('d-none');

                numarRezultate.textContent =
                    `${date.length} cărți recomandate, ` +
                    'ordonate după compatibilitate.';

                listaRecomandari.replaceChildren();

                if (date.length === 0) {
                    listaRecomandari.appendChild(
                        creeazaElement(
                            'p',
                            'text-muted',
                            'Nu am găsit cărți care să corespundă preferințelor tale. ' +
                            'Încearcă să modifici preferințele.'
                        )
                    );git branch--show - current
                    return;
                }

                date.forEach(carte => {
                    listaRecomandari.appendChild(
                        afiseazaCarte(carte)
                    );
                });

            } catch (eroare) {
                console.error(eroare);
                afiseazaEroare(eroare.message);
            }
        }

        incarcaRecomandari();</script>

</body>
</html>
