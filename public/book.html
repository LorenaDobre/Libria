
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Detalii carte - Libria</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #faf7f2;
            color: #30263b;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: #49345f;
        }

        .navbar-brand {
            color: white !important;
            font-weight: 700;
            font-size: 1.6rem;
        }

        .navbar a {
            color: white;
            text-decoration: none;
        }

            .navbar a:hover {
                color: #e8d9f5;
            }

        .book-container {
            background: white;
            border-radius: 22px;
            padding: 40px;
            box-shadow: 0 12px 35px rgba(50, 30, 70, 0.08);
        }

        .book-cover {
            width: 100%;
            max-width: 300px;
            max-height: 440px;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
        }

        .cover-placeholder {
            width: 100%;
            max-width: 300px;
            min-height: 380px;
            background: linear-gradient(145deg, #77568e, #38284d);
            color: white;
            border-radius: 12px;
            padding: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .book-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #49345f;
        }

        .book-author {
            font-size: 1.25rem;
            color: #756781;
        }

        .detail-label {
            font-weight: 700;
            color: #49345f;
        }

        .detail-badge {
            display: inline-block;
            background: #eee4f4;
            color: #49345f;
            padding: 7px 14px;
            border-radius: 20px;
            margin: 4px 5px 4px 0;
        }

        .back-link {
            color: #65467d;
            font-weight: 600;
            text-decoration: none;
        }

            .back-link:hover {
                text-decoration: underline;
            }

        .description {
            line-height: 1.8;
            font-size: 1.05rem;
        }

        @media (max-width: 768px) {
            .book-container {
                padding: 24px;
            }

            .book-title {
                font-size: 1.7rem;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar px-4 py-3">
        <div class="container">
            <a class="navbar-brand" href="/">Libria</a>
            <a href="/">Catalogul de carti</a>
        </div>
    </nav>

    <main class="container my-5">

        <a href="/" class="back-link">
            &larr; Inapoi la catalog
        </a>

        <div id="loading" class="text-center py-5">
            Se incarca informatiile cartii...
        </div>

        <div id="error"
             class="alert alert-danger mt-4 d-none"
             role="alert">
        </div>

        <div id="bookDetails"
             class="book-container mt-4 d-none">

            <div class="row g-5">

                <div class="col-md-4 text-center">
                    <img id="bookCover"
                         class="book-cover d-none"
                         alt="Coperta cartii">

                    <div id="coverPlaceholder"
                         class="cover-placeholder d-none">
                    </div>
                </div>

                <div class="col-md-8">

                    <h1 id="bookTitle" class="book-title"></h1>

                    <p id="bookAuthor" class="book-author"></p>

                    <hr class="my-4">

                    <h4>Despre carte</h4>

                    <p id="bookDescription"
                       class="description mt-3"></p>

                    <hr class="my-4">

                    <div class="mb-3">
                        <span class="detail-label">
                            Genuri literare:
                        </span>
                        <div id="bookGenres" class="mt-2"></div>
                    </div>

                    <div class="mb-3">
                        <span class="detail-label">
                            Teme abordate:
                        </span>
                        <div id="bookThemes" class="mt-2"></div>
                    </div>

                    <div class="mb-3">
                        <span class="detail-label">
                            Anul aparitiei:
                        </span>
                        <span id="bookYear"></span>
                    </div>

                    <div class="mb-3">
                        <span class="detail-label">
                            Numar de pagini:
                        </span>
                        <span id="bookPages"></span>
                    </div>

                </div>
            </div>
        </div>

    </main>

    <script>
        function afiseazaEtichete(container, valoare) {
            container.replaceChildren();

            const elemente = (valoare || 'Nespecificat')
                .split(',')
                .map(text => text.trim())
                .filter(Boolean);

            elemente.forEach(text => {
                const badge = document.createElement('span');
                badge.className = 'detail-badge';
                badge.textContent = text;
                container.appendChild(badge);
            });
        }

        async function incarcaDetalii() {
            const params = new URLSearchParams(
                window.location.search
            );

            const id = params.get('id');

            const loading = document.getElementById('loading');
            const errorBox = document.getElementById('error');
            const details = document.getElementById('bookDetails');

            if (!id || !/^[1-9]\d*$/.test(id)) {
                loading.classList.add('d-none');
                errorBox.textContent =
                    'Nu a fost selectata o carte valida.';
                errorBox.classList.remove('d-none');
                return;
            }

            try {
                const response = await fetch(
                    '/api/books/' + encodeURIComponent(id)
                );

                if (!response.ok) {
                    throw new Error(
                        response.status === 404
                            ? 'Cartea nu a fost gasita.'
                            : 'Nu s-au putut incarca detaliile.'
                    );
                }

                const carte = await response.json();

                document.title = carte.title + ' - Libria';

                document.getElementById('bookTitle')
                    .textContent = carte.title;

                document.getElementById('bookAuthor')
                    .textContent = 'de ' + carte.author;

                document.getElementById('bookDescription')
                    .textContent =
                    carte.description ||
                    'Descriere indisponibila.';

                document.getElementById('bookYear')
                    .textContent =
                    carte.publication_year ?? 'Nespecificat';

                document.getElementById('bookPages')
                    .textContent =
                    carte.pages ?? 'Nespecificat';

                afiseazaEtichete(
                    document.getElementById('bookGenres'),
                    carte.genres
                );

                afiseazaEtichete(
                    document.getElementById('bookThemes'),
                    carte.themes
                );

                const cover = document.getElementById('bookCover');
                const placeholder =
                    document.getElementById('coverPlaceholder');

                placeholder.textContent = carte.title;

                if (carte.cover_url) {
                    cover.onload = () => {
                        cover.classList.remove('d-none');
                        placeholder.classList.add('d-none');
                    };

                    cover.onerror = () => {
                        cover.classList.add('d-none');
                        placeholder.classList.remove('d-none');
                    };

                    cover.src = carte.cover_url;
                } else {
                    placeholder.classList.remove('d-none');
                }

                details.classList.remove('d-none');

            } catch (error) {
                errorBox.textContent = error.message;
                errorBox.classList.remove('d-none');
            } finally {
                loading.classList.add('d-none');
            }
        }

        incarcaDetalii();
    </script>

</body>
</html>
