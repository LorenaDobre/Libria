
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Libria | Catalog de cărți</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                Libria
            </a>
            <span class="text-white">
                Descoperă următoarea ta carte
            </span>
        </div>
    </nav>

    <main class="container py-5">
        <h1 class="mb-2">Catalogul de cărți</h1>
        <p class="text-muted mb-4">
            Explorează cărțile disponibile în Libria.
        </p>

        <div id="mesaj" class="alert alert-info">
            Se încarcă catalogul...
        </div>

        <div id="catalog" class="row g-4"></div>
    </main>

    <script>
        async function incarcaCatalogul() {
            const catalog = document.getElementById('catalog');
            const mesaj = document.getElementById('mesaj');

            try {
                const raspuns = await fetch('/api/books');

                if (!raspuns.ok) {
                    throw new Error('Eroare la încărcarea cărților.');
                }

                const carti = await raspuns.json();

                if (carti.length === 0) {
                    mesaj.textContent =
                        'Catalogul este momentan gol. Cărțile vor fi adăugate în curând.';
                    return;
                }

                mesaj.classList.add('d-none');

                carti.forEach(carte => {
                    const coloana = document.createElement('div');
                    coloana.className = 'col-md-6 col-lg-4';

                    const card = document.createElement('div');
                    card.className = 'card h-100 shadow-sm';

                    const corp = document.createElement('div');
                    corp.className = 'card-body';

                    const titlu = document.createElement('h5');
                    titlu.className = 'card-title';
                    titlu.textContent = carte.title;

                    const autor = document.createElement('p');
                    autor.className = 'text-secondary';
                    autor.textContent = carte.author;

                    const gen = document.createElement('p');
                    gen.textContent = 'Gen: ' + carte.genres;

                    const pagini = document.createElement('p');
                    pagini.textContent =
                        'Pagini: ' + (carte.pages ?? 'Nespecificat');

                    corp.append(titlu, autor, gen, pagini);
                    card.appendChild(corp);
                    coloana.appendChild(card);
                    catalog.appendChild(coloana);
                });

            } catch (eroare) {
                mesaj.className = 'alert alert-danger';
                mesaj.textContent =
                    'Catalogul nu poate fi încărcat momentan.';
                console.error(eroare);
            }
        }

        incarcaCatalogul();
    </script>

</body>
</html>
